name: Release

# Builds the two downloads of OVMS Manager, the AppImage and the archive for install.sh, and publishes them in the
# GitHub release of the tag, with the notes of that version from CHANGELOG.md.
# Runs on every pushed tag "v*"; it can also be started by hand for an existing tag (Actions → Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0 (1.0.0 works too)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System libraries for the import check
        # what Qt loads from the system (the same as on a desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 \
            libglib2.0-0 libdbus-1-3

      - name: Resolve the tag
        run: |
          TAG="${TAG#refs/tags/}"
          [[ "$TAG" == v* ]] || TAG="v$TAG"   # accept "1.0.0" typed by hand
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || {
            echo "::error::Tag $TAG does not exist. Existing tags: $(git tag | tr '\n' ' ')"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build the AppImage from the tag
        # the build scripts of this checkout build the sources of the tag, so older tags can be rebuilt too
        run: |
          git worktree add --detach "$RUNNER_TEMP/src" "refs/tags/$TAG"
          bash packaging/build-appimage.sh --source "$RUNNER_TEMP/src" --out dist

      - name: Build the archive for install.sh
        run: bash packaging/build-tarball.sh --source "$RUNNER_TEMP/src" --out dist

      - name: Check the archive
        # it unpacks into one folder whose installer finds every file it needs
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP"/unpacked/*/
          test -x install.sh
          ./install.sh --help > /dev/null
          eval "$(sed -n '/^FILES=(/,/)/p' install.sh)"
          eval "$(sed -n '/^COMMON_FILES=(/,/)$/p' install.sh)"
          for f in "${FILES[@]}"; do test -f "$f" || { echo "::error::Missing $f"; exit 1; }; done
          for f in "${COMMON_FILES[@]}"; do test -f "common/$f" || { echo "::error::Missing common/$f"; exit 1; }; done
          echo "archive OK: $(ls "$GITHUB_WORKSPACE"/dist/*.tar.gz)"

      - name: Checksums
        run: cd dist && sha256sum ./*.AppImage ./*.tar.gz | sed 's|\./||' > SHA256SUMS && cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        # the section "## [x.y.z]" of the tag, up to the next version
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' "$RUNNER_TEMP/src/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]] || ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for the changes." > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "OVMS Manager ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          gh release upload "$TAG" dist/*.AppImage dist/*.tar.gz dist/SHA256SUMS --clobber
